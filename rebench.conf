# -*- mode: yaml -*-
# Config file for ReBench
default_experiment: all
default_data_file: 'benchmark.data'

.are_we_fast_yet:
    ## this is ignored by rebench
    iteration_numbers:
        fast_vm:      &FAST_VM      100
        slow_vm:      &SLOW_VM      10
        very_slow_vm: &VERY_SLOW_VM 5

reporting:
    rebenchdb:
        db_url: https://rebench.dev/rebenchdb
        repo_url: https://github.com/smarr/are-we-fast-yet
        record_all: true # make sure everything is recorded
        project_name: Are We Fast Yet

# definition of benchmark suites
benchmark_suites:
    all:
        gauge_adapter: RebenchLog
        command: " %(benchmark)s %(iterations)s "
        max_invocation_time: 5000
        location: benchmarks
        benchmarks:
            - DeltaBlue:
                extra_args: 12000
            - Richards:
                extra_args: 100
            - Json:
                extra_args: 100
            - CD:
                extra_args: 250
            - Havlak:
                extra_args: 1500

            - Bounce:
                extra_args: 1500
            - List:
                extra_args: 1500
            - Mandelbrot:
                extra_args: 500
            - NBody:
                extra_args: 250000
            - Permute:
                extra_args: 1000
            - Queens:
                extra_args: 1000
            - Sieve:
                extra_args: 3000
            - Storage:
                extra_args: 1000
            - Towers:
                extra_args: 600

# VMs have a name and are specified by a path and the binary to be executed
executors:
    C++:
      path: benchmarks/C++
      executable: harness-clang++-22-O3-lto-marchnative
      iterations: *SLOW_VM
      env:
        PATH: /usr/bin:/bin:/sbin
      build:
        - CXX=clang++-22 OPT='-O3 -flto -march=native' ./build.sh
    
    Crystal:
      path: benchmarks/Crystal
      executable: harness
      env: 
        HOME: /home/gitlab-runner
        PATH: /home/gitlab-runner/.asdf/installs/crystal/1.22.3/bin:/home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      build:
        - /home/gitlab-runner/.asdf/bin/asdf install crystal 1.22.3
        - ./build.sh

    CSharp:
      path: benchmarks/CSharp
      executable: bin/Release/net11.0/Benchmarks
      iterations: *FAST_VM
      env:
        HOME: /home/gitlab-runner
        DOTNET_ROOT: /home/gitlab-runner/.asdf/installs/dotnet/11.0.100
        DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        DOTNET_NOLOGO: "1"
        PATH: /home/gitlab-runner/.asdf/installs/dotnet/11.0.100:/home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      build:
        - /home/gitlab-runner/.asdf/bin/asdf install dotnet 11.0.100
        - ./build.sh

    Java-int:
        executable: /home/gitlab-runner/.asdf/installs/java/temurin-27.0.1+0/bin/java
        args: " -Xint -cp Java/benchmarks.jar Harness "
        iterations: *VERY_SLOW_VM
        build:
          - /home/gitlab-runner/.asdf/bin/asdf install java temurin-27.0.1+0
          - (cd benchmarks/Java ; ant clean; ant jar)
        env:
          HOME: /home/gitlab-runner
          PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          JAVA_HOME: /home/gitlab-runner/.asdf/installs/java/temurin-27.0.1+0
    Java-jit:
        executable: /home/gitlab-runner/.asdf/installs/java/temurin-27.0.1+0/bin/java
        args: " -cp Java/benchmarks.jar Harness "
        iterations: *FAST_VM
        build:
            - /home/gitlab-runner/.asdf/bin/asdf install java temurin-27.0.1+0
            - (cd benchmarks/Java ; ant clean; ant jar)
        env:
          HOME: /home/gitlab-runner
          PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          JAVA_HOME: /home/gitlab-runner/.asdf/installs/java/temurin-27.0.1+0
    Node-int:
        executable: /home/gitlab-runner/.asdf/installs/nodejs/26.13.1/bin/node
        args: " --jitless JavaScript/harness.js "
        iterations: *VERY_SLOW_VM
        build: [ /home/gitlab-runner/.asdf/bin/asdf install nodejs 26.13.1 ]
        env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }

    Node-jit:
        executable: /home/gitlab-runner/.asdf/installs/nodejs/26.13.1/bin/node
        args: " JavaScript/harness.js "
        iterations: *FAST_VM
        build: [ /home/gitlab-runner/.asdf/bin/asdf install nodejs 26.13.1 ]
        env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }

    Lua-int:
        executable: /home/gitlab-runner/.asdf/installs/lua/5.4.8/bin/lua
        args: " Lua/harness.lua "
        iterations: *VERY_SLOW_VM
        build: [ /home/gitlab-runner/.asdf/bin/asdf install lua 5.4.8 ]
        env: { LUA_PATH: "Lua/?.lua;;", HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }
    
    Python-int:
      executable: /usr/bin/python3.13
      args: " Python/harness.py "
      iterations: *VERY_SLOW_VM

    Ruby-int:
      executable: /home/gitlab-runner/.asdf/installs/ruby/4.0.9/bin/ruby
      args: " Ruby/harness.rb "
      iterations: *VERY_SLOW_VM
      build: [ /home/gitlab-runner/.asdf/bin/asdf install ruby 4.0.9 ]
      env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }

    Ruby-jit:
      executable: /home/gitlab-runner/.asdf/installs/ruby/4.0.9/bin/ruby
      args: " --yjit Ruby/harness.rb "
      iterations: *VERY_SLOW_VM
      build: [ /home/gitlab-runner/.asdf/bin/asdf install ruby 4.0.9 ]
      env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }
 
    Squeak-jit:
      executable: /home/gitlab-runner/.asdf/installs/awfy/squeak-6.1-23976/bin/squeak
      args: " -headless Smalltalk/AWFY_Squeak.image Smalltalk/run.st "
      iterations: *VERY_SLOW_VM
      env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }
      build:
        - /home/gitlab-runner/.asdf/bin/asdf install awfy squeak-6.1-23976
        - |
            cp /home/gitlab-runner/.asdf/installs/awfy/squeak-6.1-23976/shared/*.sources  benchmarks/Smalltalk
            cp /home/gitlab-runner/.asdf/installs/awfy/squeak-6.1-23976/shared/S*.image   benchmarks/Smalltalk/Squeak.image
            cp /home/gitlab-runner/.asdf/installs/awfy/squeak-6.1-23976/shared/S*.changes benchmarks/Smalltalk/Squeak.changes
            cd benchmarks/Smalltalk
            /home/gitlab-runner/.asdf/installs/awfy/squeak-6.1-23976/bin/squeak -headless Squeak.image build-image-squeak.st

    Pharo-jit:
        executable: /home/gitlab-runner/.asdf/installs/awfy/pharo-120/pharo
        args: " -headless Smalltalk/AWFY_Pharo.image Smalltalk/run.st "
        iterations: *VERY_SLOW_VM
        env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }
        build:
          - /home/gitlab-runner/.asdf/bin/asdf install awfy pharo-120
          - |
            cp /home/gitlab-runner/.asdf/installs/awfy/pharo-120/*.sources   benchmarks/Smalltalk
            cp /home/gitlab-runner/.asdf/installs/awfy/pharo-120/Ph*.image   benchmarks/Smalltalk/Pharo.image
            cp /home/gitlab-runner/.asdf/installs/awfy/pharo-120/Ph*.changes benchmarks/Smalltalk/Pharo.changes
            cd benchmarks/Smalltalk
            /home/gitlab-runner/.asdf/installs/awfy/pharo-120/pharo Pharo.image build-image.st

    SOMpp-int:
        executable: ../SOMpp/SOM++
        args: " -H512MB -cp SOM:SOM/Core:SOM/CD:SOM/DeltaBlue:SOM/Havlak:SOM/Json:SOM/NBody:SOM/Richards:../SOMpp/Smalltalk SOM/Harness.som "
        iterations: *VERY_SLOW_VM
        env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }
        build:
          - git clone --depth=1 https://github.com/SOM-st/SOMpp.git SOMpp
          - cd SOMpp
          - git clean -x -f -d
          - cmake . -DCMAKE_BUILD_TYPE=Release
          - make -j

    TruffleSOM-jit:
        executable: ../TruffleSOM/som
        args: " -cp SOM:SOM/Core:SOM/CD:SOM/DeltaBlue:SOM/Havlak:SOM/Json:SOM/NBody:SOM/Richards:../TruffleSOM/Smalltalk SOM/Harness.som "
        iterations: *FAST_VM
        env: { HOME: /home/gitlab-runner, PATH: /home/gitlab-runner/.asdf/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }
        build:
          - git clone --depth=1 https://github.com/graalvm/mx.git
          - git clone --depth=1 https://github.com/SOM-st/TruffleSOM.git
          - export PATH=$PATH:`pwd`/mx
          - cd TruffleSOM
          - ./som --setup labsjdk
          - mx sforceimport
          - rm libs/jvmci || true
          - ./som --setup labsjdk
          - export JVMCI_VERSION_CHECK=ignore
          - mx --env libgraal build

experiments:
    all:
        description: Measure steady state performance
        suites: [all]
        executions:
          - C++
          - Crystal
          - CSharp
          - Java-int
          - Java-jit
          - Node-int
          - Node-jit
          - Lua-int
          - Python-int
          - Ruby-int
          - Ruby-jit
          # - Squeak-jit
          - Pharo-jit
          - SOMpp-int
          - TruffleSOM-jit
